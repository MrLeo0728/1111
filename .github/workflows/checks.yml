name: Workbench checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python automation/analyze_ads.py --input examples/ads_sample.csv --output reports/local/ads-review.md
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-ads-review
          path: reports/local/ads-review.md
